        e.target.tagName, String(e.target.src || e.target.href || ''));

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be

    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }

      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

            let totalLen = 0;

              const { done, value } = await reader.read();

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

          }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than

    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).

    document.documentElement.replaceWith(doc.documentElement);

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Cue — keep track of what you watch<\u002Ftitle>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* latin-ext */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"c68b4ab3-b14a-4fd1-9deb-bb3c4f0aad2b\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"2dac2a36-a5f4-4eda-b6fc-e717d4a5d824\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"60388e41-da56-4138-b34b-cdb0b7ae9e87\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"a386c037-aa64-4911-b03b-cde50864bba9\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* Cue — tokens, keyframes, resets, top bar, drawer, landing and auth shells */\n:root{\n  --bg:#0B0B0C; --bg-2:#101012; --bg-3:#17171A; --line:rgba(255,255,255,.08);\n  --line-2:rgba(255,255,255,.16); --fg:#F2EFE9; --fg-2:#BDB8AF; --mut:#8C877E; --mut-2:#6E6960;\n  --gold:#C7A008; --gold-2:#E8BC2E;\n  --serif:\"Instrument Serif\",Georgia,serif;\n  --sans:\"Helvetica Neue\",Helvetica,Arial,sans-serif;\n  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;\n  --r:10px; --pad:clamp(16px,3.5vw,32px);\n  --ease:cubic-bezier(.2,.7,.2,1); --dur:.22s;\n}\n@keyframes fade{from{opacity:0}to{opacity:1}}\n@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}\n@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:none}}\n@keyframes slidedown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}\n*{box-sizing:border-box}\nhtml,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased}\nbody{min-height:100vh;display:flex;flex-direction:column}\na{color:var(--gold-2);text-decoration:none}\na:hover{color:#F5D45F}\nbutton,input{font:inherit;color:inherit}\nbutton{background:none;border:0;cursor:pointer}\nh1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;letter-spacing:.01em}\nh1{font-size:clamp(28px,4.6vw,44px);line-height:1.02}\nh2{font-size:clamp(19px,2.4vw,24px);line-height:1.05}\nh3{font-size:clamp(17px,2vw,20px)}\n.mono{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--mut-2);text-transform:uppercase}\n.spacer{flex:1}\n.glyph{font-size:16px;line-height:1}\n\n/* ── top bar ── */\n.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:clamp(12px,2vw,26px);\n  padding:0 var(--pad);height:62px;background:rgba(11,11,12,.96);backdrop-filter:blur(8px);\n  border-bottom:1px solid var(--line)}\n.brand{font-family:var(--serif);font-size:25px;color:var(--fg)}\n.brand:hover{color:var(--fg)}\n.nav{display:flex;gap:clamp(14px,2vw,24px);flex:0 0 auto;white-space:nowrap;overflow:visible}\n.nav a{font-size:14px;font-weight:500;color:var(--mut)}\n.nav a:hover{color:var(--fg)}\n.nav a.on{color:var(--fg)}\n.iconbtn{display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.1);border-radius:8px;\n  padding:9px 12px;color:var(--mut);flex:0 0 auto}\n.iconbtn:hover{border-color:rgba(199,160,8,.55);color:var(--gold-2)}\n.kbd{font-family:var(--mono);font-size:10px;letter-spacing:.1em}\n.avatar{width:32px;height:32px;flex:0 0 auto;border-radius:50%;background:var(--gold);color:#0B0B0C;\n  display:grid;place-items:center;font-size:13px;font-weight:600}\n.avatar:hover{color:#0B0B0C;filter:brightness(1.1)}\n.menubtn{display:none}\n.drawer-scrim{position:fixed;inset:62px 0 0;z-index:39;background:rgba(6,6,7,.72);\n  display:flex;justify-content:flex-end;align-items:flex-start;padding:16px var(--pad) 0}\n.drawer-wrap{width:min(360px,100%);display:flex;flex-direction:column;align-items:flex-end;gap:14px}\n.closebtn{border:1px solid var(--line-2);border-radius:100px;padding:13px 20px;min-height:44px;\n  font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg);\n  display:flex;align-items:center;gap:10px;background:rgba(11,11,12,.9)}\n.closebtn span{font-family:var(--sans);font-size:15px;letter-spacing:0}\n.closebtn:hover{border-color:var(--gold);color:var(--gold-2)}\n.drawer{width:100%;background:#111113;border:1px solid var(--line-2);border-radius:12px;overflow:hidden;\n  box-shadow:0 30px 70px rgba(0,0,0,.6);display:flex;flex-direction:column}\n.drawer-label{padding:16px 18px;font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;\n  color:var(--mut-2);border-bottom:1px solid var(--line)}\n.drawer a,.drawer .drawer-search{display:flex;align-items:center;gap:14px;padding:0 18px;min-height:62px;\n  font-family:var(--mono);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg);\n  border-bottom:1px solid var(--line);text-align:left;width:100%}\n.drawer i{font-style:normal;font-size:12px;color:var(--mut-2)}\n.drawer .arw{margin-left:auto;color:var(--mut-2);font-size:13px;letter-spacing:.1em}\n.drawer a:hover,.drawer .drawer-search:hover{background:rgba(255,255,255,.04);color:var(--gold-2)}\n.drawer a:hover .arw,.drawer .drawer-search:hover .arw{color:var(--gold-2);transform:translateX(4px)}\n.drawer .drawer-search{border-bottom:0;color:var(--mut)}\n\n.anon-actions{display:none;gap:10px;align-items:center;flex:0 0 auto}\n.anon-actions .pill,.anon-actions .btn{min-height:40px;display:flex;align-items:center;padding:10px 16px;font-size:13px}\nbody.anon .nav,body.anon .iconbtn,body.anon .avatar,body.anon .menubtn{display:none}\nbody.anon .anon-actions{display:flex}\n\n/* ── first run / landing / auth ── */\n.firstrun{display:flex;flex-direction:column;gap:16px;max-width:660px;padding-top:clamp(12px,4vh,48px)}\n.steps{display:grid;gap:clamp(14px,2vw,20px);grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:14px}\n.step{padding:20px;border:1px solid var(--line);border-radius:12px;background:var(--bg-2);display:flex;flex-direction:column;gap:9px}\n.step .mono{color:var(--gold)}\n.step b{font-family:var(--serif);font-weight:400;font-size:22px}\n.step p{margin:0;font-size:13px;line-height:1.6;color:var(--mut)}\n.billboard.landing{min-height:clamp(420px,64vh,680px)}\n.rail.wall>.tile{flex:0 0 clamp(104px,13vw,140px)}\n.cta{padding:clamp(24px,4vw,40px);display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}\n.cta h2{max-width:26ch}\n.authwrap{display:flex;justify-content:center;padding:clamp(12px,5vh,56px) 0}\n.authcard{width:min(420px,100%);padding:clamp(24px,4vw,34px);display:flex;flex-direction:column;gap:14px}\n.authform{display:flex;flex-direction:column;gap:14px;margin:6px 0 4px}\n.authform label{display:flex;flex-direction:column;gap:8px;font-family:var(--mono);font-size:10px;\n  letter-spacing:.16em;text-transform:uppercase;color:var(--mut-2)}\n.authform input{background:var(--bg-3);border:1px solid var(--line);border-radius:8px;padding:14px;min-height:48px;\n  font-family:var(--sans);font-size:15px;letter-spacing:0;color:var(--fg)}\n.authform input:focus{outline:0;border-color:rgba(199,160,8,.55)}\n.pickerbody{padding:20px;display:flex;flex-direction:column;gap:16px}\n\n.view{flex:1;padding:clamp(20px,3vw,32px) var(--pad) 64px;display:flex;flex-direction:column;gap:clamp(26px,3.5vw,38px);max-width:1440px;width:100%;margin:0 auto}\n.pagefoot{border-top:1px solid var(--line);padding:22px var(--pad);display:flex;gap:16px;flex-wrap:wrap;\n  align-items:center;justify-content:space-between;color:var(--mut-2);font-size:13px}\n\n/* ── generic bits ── */\n<\u002Fstyle>\n<style>/* Cue — cards, posters, grids, rails, hero, rows, media page, board, people */\n.sec{display:flex;flex-direction:column;gap:14px}\n.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}\n.sec-note{font-size:13px;color:var(--mut-2)}\n.card{background:var(--bg-2);border:1px solid var(--line);border-radius:12px}\n.pill{border:1px solid var(--line-2);border-radius:100px;padding:9px 14px;font-size:12px;font-weight:500;color:var(--mut);white-space:nowrap}\n.pill.on{background:var(--gold);border-color:var(--gold);color:#0B0B0C}\n.pill:hover{color:var(--fg)}\n.pill.on:hover{color:#0B0B0C}\n.btn{border-radius:8px;padding:13px 18px;font-size:14px;font-weight:600;background:var(--gold);color:#0B0B0C;min-height:44px}\n.btn:hover{background:#E0B60F}\n.btn.ghost{background:none;border:1px solid var(--line-2);color:var(--fg);font-weight:500}\n.btn.ghost:hover{border-color:rgba(255,255,255,.34);background:rgba(255,255,255,.04)}\n.btn.sm{padding:10px 13px;font-size:13px}\n.seg{display:flex;gap:5px;padding:4px;background:#191919;border-radius:9px}\n.seg button{flex:1;padding:12px 8px;border-radius:6px;font-size:13px;font-weight:500;color:var(--mut);min-height:44px}\n.seg button:hover{color:var(--fg)}\n.seg button.on{background:var(--gold);color:#0B0B0C}\n.chiprow{display:flex;gap:8px;flex-wrap:wrap}\n.empty{padding:34px 0;display:flex;flex-direction:column;gap:9px;max-width:460px}\n.empty p{margin:0;color:var(--mut-2);font-size:14px;line-height:1.55}\n.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}\n.bar>i{display:block;height:100%;background:var(--gold)}\n.stars{display:flex;gap:4px}\n.stars button{font-size:22px;line-height:1;color:#3A3934;padding:0;min-width:26px}\n.stars button.on{color:var(--gold-2)}\n.starstr{color:var(--gold);letter-spacing:.08em;font-size:13px}\n\n/* ── posters ── */\n.poster{display:block;position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;border:1px solid var(--line);\n  background:repeating-linear-gradient(115deg,hsl(var(--h) 20% 16%) 0 9px,hsl(var(--h) 20% 21%) 9px 18px)}\n.poster.art img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover}\n.poster .cap{position:absolute;left:8px;bottom:8px;right:8px;font-family:var(--mono);font-size:9px;line-height:1.35;\n  letter-spacing:.08em;color:rgba(242,239,233,.42);text-transform:uppercase}\n.poster .fav{position:absolute;right:8px;top:8px;font-size:13px;color:var(--gold-2)}\n.poster .plus,.poster .more{position:absolute;width:34px;height:34px;border-radius:50%;\n  background:rgba(11,11,12,.84);border:1px solid var(--line-2);color:var(--gold-2);display:grid;place-items:center;font-size:15px}\n.poster .plus{right:7px;bottom:7px}\n.poster .more{right:7px;top:7px;border-radius:8px;color:var(--fg-2);font-size:14px}\n.poster .plus:hover,.poster .more:hover{background:var(--gold);color:#0B0B0C}\n\n.grid{display:grid;gap:clamp(14px,1.6vw,22px);grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}\n.grid.wide{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}\n.tile{display:flex;flex-direction:column;gap:8px;position:relative}\n.tile .name{font-size:13px;font-weight:500;line-height:1.3}\n.tile .sub{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:#7E7970;text-transform:uppercase}\n.tile a{color:inherit}\n\n.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;scrollbar-width:none}\n.rail::-webkit-scrollbar{display:none}\n.rail>*{flex:0 0 clamp(112px,15vw,150px);scroll-snap-align:start}\n\n.menu{position:absolute;right:6px;top:44px;width:172px;background:#1A1A1D;border:1px solid var(--line-2);\n  border-radius:9px;padding:5px;display:flex;flex-direction:column;z-index:20}\n.menu button{text-align:left;padding:11px 10px;border-radius:5px;font-size:12px;font-weight:500;color:var(--fg-2)}\n.menu button:hover{background:rgba(255,255,255,.07)}\n.menu button.on{color:var(--gold-2)}\n\n/* ── billboard hero ── */\n.billboard{position:relative;margin:calc(-1 * clamp(20px,3vw,32px)) calc(-1 * var(--pad)) 0;\n  min-height:clamp(380px,58vh,620px);display:flex;align-items:flex-end;overflow:hidden;border-bottom:1px solid var(--line)}\n.bb-art{position:absolute;inset:0;background-size:cover;background-position:center 22%;\n  background-image:repeating-linear-gradient(115deg,hsl(var(--h) 20% 15%) 0 14px,hsl(var(--h) 20% 20%) 14px 28px)}\n.bb-art::after{content:\"\";position:absolute;inset:0;\n  background:linear-gradient(180deg,rgba(11,11,12,.2) 0%,rgba(11,11,12,.55) 46%,var(--bg) 100%),\n    linear-gradient(90deg,rgba(11,11,12,.82),rgba(11,11,12,0) 64%)}\n.bb-cap{position:absolute;right:14px;top:14px;font-family:var(--mono);font-size:9px;letter-spacing:.14em;\n  color:rgba(242,239,233,.4);text-transform:uppercase;z-index:1}\n.bb-body{position:relative;z-index:2;padding:clamp(24px,4vw,44px) var(--pad);display:flex;flex-direction:column;gap:14px;\n  max-width:700px;width:100%}\n.bb-body h1{font-size:clamp(38px,7vw,76px)}\n.bb-body .bar{max-width:380px}\n\n/* ── hero (compact) ── */\n.hero{display:flex;gap:clamp(16px,2.4vw,24px);padding:clamp(16px,2.2vw,22px);border:1px solid var(--line);\n  border-radius:12px;background:linear-gradient(100deg,#17171A,#0F0F11);flex-wrap:wrap}\n.hero .poster{flex:0 0 clamp(88px,11vw,112px)}\n.hero .meat{flex:1 1 260px;display:flex;flex-direction:column;gap:11px;justify-content:center}\n.kicker{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}\n.hero h2{font-size:clamp(28px,4vw,40px);line-height:1.03}\n.se{font-family:var(--mono);font-size:13px;color:#9B958B}\n.rowbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}\n\n/* ── list rows ── */\n.rows{display:flex;flex-direction:column}\n.row{display:flex;align-items:center;gap:13px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.06)}\n.row .poster{flex:0 0 36px;border-radius:5px}\n.row .body{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}\n.row .body b{font-size:14px;font-weight:500}\n.row .body span{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:#7E7970;text-transform:uppercase}\n\n/* ── media page ── */\n.title-wrap{display:grid;gap:clamp(20px,3vw,32px);grid-template-columns:minmax(0,196px) minmax(0,1fr) minmax(0,236px);align-items:start}\n.title-wrap .col{display:flex;flex-direction:column;gap:16px;min-width:0}\n.backdrop{position:absolute;inset:0 0 auto;height:320px;opacity:.42;\n  background:repeating-linear-gradient(115deg,hsl(var(--h) 20% 16%) 0 9px,hsl(var(--h) 20% 21%) 9px 18px);z-index:-2}\n.backdrop-fade{position:absolute;inset:0 0 auto;height:320px;background:linear-gradient(180deg,rgba(11,11,12,.4),var(--bg));z-index:-1}\n.title-head h1{font-size:clamp(34px,6vw,52px)}\n.badge{display:inline-flex;align-items:center;gap:8px;margin-top:12px;border:1px solid rgba(199,160,8,.45);\n  border-radius:100px;padding:7px 14px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;\n  text-transform:uppercase;color:var(--gold-2)}\n.overview{color:var(--fg-2);font-size:15px;line-height:1.65;text-wrap:pretty;max-width:62ch}\n.panel{display:flex;flex-direction:column;gap:12px;padding:20px;border:1px solid var(--line);border-radius:12px;background:var(--bg-2)}\n.panel.gold{border-color:rgba(199,160,8,.28);background:linear-gradient(100deg,rgba(199,160,8,.09),rgba(199,160,8,0))}\n.season{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 15px;\n  border:1px solid var(--line);border-radius:9px;background:var(--bg-2);width:100%;text-align:left}\n.season.on{border-color:rgba(199,160,8,.35);background:rgba(199,160,8,.08)}\n.season b{font-size:14px;font-weight:500;display:block;margin-bottom:5px}\n.season span{font-family:var(--mono);font-size:11px;color:#7E7970}\n.tags{display:flex;gap:9px;flex-wrap:wrap;align-items:center}\n.tag{display:flex;align-items:center;gap:8px;background:var(--bg-3);border:1px solid rgba(255,255,255,.09);\n  border-radius:100px;padding:7px 14px 7px 8px;font-size:13px;font-weight:500}\n.tag i{width:22px;height:22px;border-radius:50%;background:#33323A;display:grid;place-items:center;\n  font-style:normal;font-size:10px;font-weight:600;color:var(--fg-2)}\n.tag em{font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut-2)}\n.tag.add{border-style:dashed;border-color:var(--line-2);background:none;color:var(--mut);padding:8px 15px}\n.tag.add:hover{border-color:var(--gold);color:var(--gold-2)}\n\n/* ── board ── */\n.board{display:grid;gap:20px;grid-template-columns:repeat(3,minmax(0,1fr))}\n.col-drop{display:flex;flex-direction:column;gap:12px;padding:16px;border:1px solid var(--line);\n  border-radius:12px;background:#0E0E10;min-height:220px}\n.col-drop.over{border-color:rgba(199,160,8,.55);background:rgba(199,160,8,.05)}\n.chit{display:flex;align-items:center;gap:11px;padding:9px;border:1px solid var(--line);border-radius:9px;\n  background:#131315;cursor:grab}\n.chit:hover{border-color:rgba(199,160,8,.5)}\n.chit .poster{flex:0 0 34px;border-radius:5px}\n.chit b{font-size:13px;font-weight:500;display:block;margin-bottom:4px}\n.chit span{font-family:
